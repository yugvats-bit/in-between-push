<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>watch · in-between push</title>
<script src="config.js"></script>
<style>
  * { box-sizing:border-box; }
  body { margin:0; background:#0b0b0b; color:#eee; font:14px/1.45 ui-monospace, Menlo, monospace; }
  .wrap { max-width:720px; margin:0 auto; padding:12px; }
  .stage { position:relative; background:#000; border-radius:8px; overflow:hidden; aspect-ratio:4/3; }
  video, canvas { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; }
  .hud { position:absolute; left:8px; top:8px; background:#000a; padding:4px 8px; border-radius:4px; font-size:12px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:10px; }
  button { background:#eee; color:#111; border:0; border-radius:6px; padding:10px 14px; font:inherit; cursor:pointer; }
  button.ghost { background:#222; color:#eee; }
  fieldset { border:1px solid #2a2a2a; border-radius:8px; margin:12px 0 0; padding:10px 12px; }
  legend { color:#999; padding:0 6px; }
  label { display:grid; grid-template-columns:150px 1fr; gap:8px; align-items:center; margin:6px 0; color:#bbb; }
  input { background:#1a1a1a; color:#eee; border:1px solid #333; border-radius:5px; padding:7px; font:inherit; width:100%; }
  input[type=range] { padding:0; }
  #log { margin-top:12px; height:150px; overflow:auto; background:#111; border-radius:8px; padding:8px; font-size:12px; color:#9a9a9a; white-space:pre-wrap; }
  .big { font-size:16px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="stage"><video id="v" playsinline muted></video><canvas id="c"></canvas><div class="hud" id="hud">not started</div></div>

  <div class="row">
    <button id="start" class="big">Start watching</button>
    <button id="stopb" class="ghost">Stop</button>
    <span id="subs" style="color:#999"></span>
  </div>

  <fieldset><legend>Where</legend>
    <label>Location <input id="loc" value="alley-1"></label>
    <label>Send secret <input id="secret" type="password" placeholder="from setup.html"></label>
  </fieldset>

  <fieldset><legend>Seen — someone enters the frame</legend>
    <label>Text <input id="m_seen" value="Seen."></label>
    <label>Cooldown (s) <input id="cd_seen" type="number" value="20"></label>
    <div class="row"><button class="ghost" data-test="seen">Test send</button></div>
  </fieldset>

  <fieldset><legend>Closer — someone gets near</legend>
    <label>Text <input id="m_closer" value="Closer."></label>
    <label>Near = body height <input id="near" type="range" min="0.1" max="0.95" step="0.01" value="0.45"></label>
    <label></label><span id="nearv" style="color:#999;margin-left:158px;font-size:12px"></span>
    <label>Cooldown (s) <input id="cd_closer" type="number" value="15"></label>
    <div class="row"><button class="ghost" data-test="closer">Test send</button></div>
  </fieldset>

  <fieldset><legend>Still seen — someone stays</legend>
    <label>Text <input id="m_still" value="Still seen."></label>
    <label>After (s) in frame <input id="still_after" type="number" value="20"></label>
    <label>Repeat every (s) <input id="still_every" type="number" value="25"></label>
    <div class="row"><button class="ghost" data-test="still">Test send</button></div>
  </fieldset>

  <fieldset><legend>Behaviour</legend>
    <label>Min gap any push (s) <input id="gap" type="number" value="5"></label>
    <label>Empty reset (s) <input id="empty" type="number" value="1.5"></label>
    <label>Confidence <input id="conf" type="number" step="0.05" value="0.4"></label>
  </fieldset>

  <div id="log"></div>
</div>

<script type="module">
import { ObjectDetector, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

const C = window.CONFIG;
const $ = (id) => document.getElementById(id);
const v = $("v"), cv = $("c"), ctx = cv.getContext("2d");

// ── remember settings on this phone ──
const FIELDS = ["loc","secret","m_seen","cd_seen","m_closer","near","cd_closer","m_still","still_after","still_every","gap","empty","conf"];
try { const s = JSON.parse(localStorage.getItem("ibp-watch") || "{}"); FIELDS.forEach(k => { if (s[k] != null) $(k).value = s[k]; }); } catch (_) {}
const save = () => { try { localStorage.setItem("ibp-watch", JSON.stringify(Object.fromEntries(FIELDS.map(k => [k, $(k).value])))); } catch (_) {} };
FIELDS.forEach(k => $(k).addEventListener("change", save));
const num = (id) => parseFloat($(id).value) || 0;
const showNear = () => $("nearv").textContent = `a person is "near" when their box is ≥ ${Math.round(num("near")*100)}% of frame height`;
$("near").oninput = showNear; showNear();

const log = (t) => { const l = $("log"); l.textContent = new Date().toLocaleTimeString() + "  " + t + "\n" + l.textContent; };

// ── sending ──
async function api(body) {
  const r = await fetch(C.SUPABASE_URL + "/functions/v1/push", {
    method: "POST",
    headers: { "Content-Type": "application/json", apikey: C.SUPABASE_ANON_KEY, Authorization: "Bearer " + C.SUPABASE_ANON_KEY },
    body: JSON.stringify(body),
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.status);
  return j;
}
const last = { any: 0, seen: 0, closer: 0, still: 0 };
async function fire(kind, force = false) {
  const now = performance.now() / 1000;
  const cd = { seen: num("cd_seen"), closer: num("cd_closer"), still: 0 }[kind];
  if (!force && (now - last.any < num("gap") || now - last[kind] < cd)) return false;
  last.any = last[kind] = now;
  const title = $("m_" + kind).value;
  log(`→ ${title}`);
  try {
    const r = await api({ action: "send", secret: $("secret").value, location: $("loc").value.trim(), title });
    log(`   delivered to ${r.sent}/${r.subscribers}` + (r.removed ? `, ${r.removed} gone` : "") + (r.failed ? `, ${r.failed} failed` : ""));
  } catch (e) { log("   ✕ " + e.message); }
  return true;
}
document.querySelectorAll("[data-test]").forEach(b => b.onclick = () => fire(b.dataset.test, true));

async function refreshCount() {
  try { const r = await api({ action: "count", location: $("loc").value.trim() }); $("subs").textContent = `${r.count} phone(s) listening at ${$("loc").value}`; } catch (_) {}
}
refreshCount(); setInterval(refreshCount, 15000);

// ── watching ──
let detector, running = false, wake;
const st = { present: false, lastSeen: 0, presentSince: 0, near: false, smooth: 0, lastStill: 0 };

async function start() {
  if (running) return;
  $("hud").textContent = "loading model…";
  if (!detector) {
    const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
    detector = await ObjectDetector.createFromOptions(vision, {
      baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite0/float16/1/efficientdet_lite0.tflite", delegate: "GPU" },
      runningMode: "VIDEO", scoreThreshold: 0.25, categoryAllowlist: ["person"], maxResults: 10,
    });
  }
  const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 960 } }, audio: false });
  v.srcObject = stream; await v.play();
  cv.width = v.videoWidth; cv.height = v.videoHeight;
  try { wake = await navigator.wakeLock.request("screen"); } catch (_) {}
  running = true; log(`watching ${$("loc").value}`);
  loop();
}
function stop() {
  running = false;
  if (v.srcObject) v.srcObject.getTracks().forEach(t => t.stop());
  v.srcObject = null; try { wake && wake.release(); } catch (_) {}
  $("hud").textContent = "stopped"; log("stopped");
}

let lastT = 0;
function loop() {
  if (!running) return;
  requestAnimationFrame(loop);
  const t = performance.now();
  if (t - lastT < 90) return;  // ~11 checks a second
  lastT = t;
  const res = detector.detectForVideo(v, t);
  const people = res.detections.filter(d => d.categories[0].score >= num("conf"));
  const H = v.videoHeight || 1;
  const maxH = people.reduce((m, d) => Math.max(m, d.boundingBox.height / H), 0);
  const now = t / 1000;

  // draw
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.lineWidth = 3; ctx.strokeStyle = "#fff"; ctx.font = "22px monospace"; ctx.fillStyle = "#fff";
  people.forEach(d => { const b = d.boundingBox; ctx.strokeRect(b.originX, b.originY, b.width, b.height); });
  ctx.strokeStyle = "#ff5a3c55"; ctx.beginPath(); ctx.moveTo(0, H * (1 - num("near"))); ctx.lineTo(cv.width, H * (1 - num("near"))); ctx.stroke();

  // presence + "Seen."
  if (people.length) {
    st.lastSeen = now;
    if (!st.present) { st.present = true; st.presentSince = now; st.lastStill = now; fire("seen"); }
  } else if (st.present && now - st.lastSeen > num("empty")) {
    st.present = false; st.near = false; st.smooth = 0;
  }

  // "Closer." (smoothed, with a little hysteresis so it doesn't flicker)
  st.smooth = 0.6 * st.smooth + 0.4 * maxH;
  if (st.present && !st.near && st.smooth >= num("near")) { st.near = true; fire("closer"); }
  if (st.near && st.smooth < num("near") - 0.06) st.near = false;

  // "Still seen."
  if (st.present && now - st.presentSince >= num("still_after") && now - st.lastStill >= num("still_every")) {
    st.lastStill = now; fire("still");
  }

  $("hud").textContent = `${people.length} person · ${Math.round(st.smooth * 100)}% · ${st.present ? Math.round(now - st.presentSince) + "s" : "empty"}${st.near ? " · NEAR" : ""}`;
}

$("start").onclick = () => start().catch(e => { log("✕ " + e.message); $("hud").textContent = "error"; });
$("stopb").onclick = stop;
</script>
</body>
</html>
